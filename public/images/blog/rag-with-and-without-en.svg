<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Without RAG and with RAG</title>
  <desc id="desc">Without RAG, the model mainly relies on knowledge in its parameters. With RAG, it can also read external evidence and cite it.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#fff7ed"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0f172a" flood-opacity=".1"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b"/></marker><style>.t{font:700 38px Inter,"Microsoft YaHei",sans-serif;fill:#0f172a}.h{font:700 26px Inter,"Microsoft YaHei",sans-serif;fill:#0f172a}.b{font:400 18px Inter,"Microsoft YaHei",sans-serif;fill:#475569}.g{font:700 18px Inter,"Microsoft YaHei",sans-serif;fill:#15803d}.r{font:700 18px Inter,"Microsoft YaHei",sans-serif;fill:#b45309}.ar{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="74" class="t">RAG does not replace the language model; it adds external evidence</text>
  <g filter="url(#s)"><rect x="70" y="130" width="600" height="535" rx="26" fill="#fff" stroke="#fdba74" stroke-width="2"/></g>
  <text x="370" y="185" text-anchor="middle" class="h">Without RAG</text>
  <rect x="135" y="225" width="190" height="76" rx="18" fill="#fff7ed"/><text x="230" y="270" text-anchor="middle" class="h">User question</text>
  <path d="M325 263H405" class="ar"/>
  <rect x="420" y="215" width="185" height="96" rx="48" fill="#ffedd5"/><text x="512" y="254" text-anchor="middle" class="h">LLM</text><text x="512" y="282" text-anchor="middle" class="b">Parametric knowledge</text>
  <path d="M512 311V370" class="ar"/>
  <rect x="175" y="385" width="390" height="120" rx="20" fill="#fff7ed"/>
  <text x="370" y="425" text-anchor="middle" class="b">Knowledge may be outdated or miss private data,</text><text x="370" y="457" text-anchor="middle" class="b">and cannot identify the supporting page.</text>
  <text x="370" y="545" text-anchor="middle" class="r">Risk: fluent, but evidence is hidden</text>
  <text x="370" y="608" text-anchor="middle" class="b">Training knowledge is stored in model parameters</text>
  <g filter="url(#s)"><rect x="730" y="130" width="600" height="535" rx="26" fill="#fff" stroke="#86efac" stroke-width="2"/></g>
  <text x="1030" y="185" text-anchor="middle" class="h">With RAG</text>
  <rect x="785" y="225" width="170" height="76" rx="18" fill="#f0fdf4"/><text x="870" y="270" text-anchor="middle" class="h">User question</text>
  <path d="M955 263H1010" class="ar"/>
  <rect x="1025" y="215" width="240" height="96" rx="20" fill="#dcfce7"/><text x="1145" y="252" text-anchor="middle" class="h">Retriever</text><text x="1145" y="281" text-anchor="middle" class="b">Search external knowledge</text>
  <path d="M1145 311V363" class="ar"/>
  <rect x="785" y="375" width="210" height="105" rx="20" fill="#ecfdf5"/><text x="890" y="416" text-anchor="middle" class="h">External evidence</text><text x="890" y="449" text-anchor="middle" class="b">report · page · table</text>
  <path d="M995 427H1040" class="ar"/>
  <rect x="1055" y="375" width="210" height="105" rx="52" fill="#d1fae5"/><text x="1160" y="416" text-anchor="middle" class="h">LLM</text><text x="1160" y="449" text-anchor="middle" class="b">question + evidence</text>
  <path d="M1160 480V525" class="ar"/>
  <rect x="905" y="540" width="350" height="66" rx="18" fill="#f0fdf4"/><text x="1080" y="581" text-anchor="middle" class="g">The answer can cite a verifiable source</text>
  <text x="1030" y="637" text-anchor="middle" class="b">External knowledge can be updated without retraining the LLM</text>
</svg>
