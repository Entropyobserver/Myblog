<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">有边界的 Agentic RAG 循环</title><desc id="desc">控制器先规划和检索，再检查证据；发现缺口时重试，证据充分或预算耗尽时停止。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#64748b"/></marker></defs><rect width="960" height="520" rx="28" fill="#f8fafc"/><text x="480" y="44" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Agentic Retrieval 需要诊断与停止条件</text><g font-family="Arial" font-size="16" font-weight="700" text-anchor="middle"><rect x="70" y="205" width="150" height="70" rx="16" fill="#dbeafe" stroke="#60a5fa"/><text x="145" y="246" fill="#1e3a8a">规划</text><rect x="285" y="205" width="150" height="70" rx="16" fill="#ede9fe" stroke="#a78bfa"/><text x="360" y="246" fill="#5b21b6">检索</text><rect x="500" y="205" width="150" height="70" rx="16" fill="#fef3c7" stroke="#f59e0b"/><text x="575" y="236" fill="#92400e">检查</text><text x="575" y="257" fill="#92400e">证据</text><rect x="735" y="105" width="160" height="70" rx="16" fill="#d1fae5" stroke="#34d399"/><text x="815" y="146" fill="#065f46">回答</text><rect x="735" y="335" width="160" height="70" rx="16" fill="#fee2e2" stroke="#f87171"/><text x="815" y="365" fill="#991b1b">拒答 /</text><text x="815" y="386" fill="#991b1b">追问</text></g><path d="M220 240H277M435 240H492M650 225L730 160M650 255L730 355" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="690" y="190" font-family="Arial" font-size="13" fill="#166534">证据充分</text><text x="675" y="315" font-family="Arial" font-size="13" fill="#991b1b">预算耗尽 / 无法完成</text><path d="M575 275V445H145V283" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="360" y="472" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#6d28d9">诊断缺口 → 改写查询 → 有限次数重试</text><rect x="300" y="75" width="360" height="64" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="480" y="101" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">停止条件</text><text x="480" y="124" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#0f172a">证据充分 · 没有新证据 · 预算限制 · 不确定性</text></svg>
