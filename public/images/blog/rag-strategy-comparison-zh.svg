<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">向量检索、GraphRAG 与 Agentic RAG 对比</title><desc id="desc">向量检索按相似度排序，GraphRAG 沿关系遍历，Agentic RAG 控制多步骤行动。</desc><rect width="960" height="500" rx="28" fill="#f8fafc"/><text x="480" y="44" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">三种不同的设计问题</text><g font-family="Arial"><rect x="35" y="82" width="280" height="350" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="175" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">向量检索</text><circle cx="120" cy="210" r="18" fill="#60a5fa"/><circle cx="195" cy="185" r="18" fill="#93c5fd"/><circle cx="225" cy="250" r="18" fill="#bfdbfe"/><circle cx="145" cy="275" r="18" fill="#dbeafe"/><text x="175" y="340" text-anchor="middle" font-size="16" fill="#334155">哪些 chunks 最相似？</text><text x="175" y="380" text-anchor="middle" font-size="14" fill="#64748b">相似度 + 最近邻</text><rect x="340" y="82" width="280" height="350" rx="22" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><text x="480" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#6d28d9">GraphRAG</text><g stroke="#8b5cf6" stroke-width="3"><path d="M410 205L480 170 550 215 465 280 410 205M480 170L465 280M550 215L410 205"/></g><g fill="#8b5cf6"><circle cx="410" cy="205" r="13"/><circle cx="480" cy="170" r="13"/><circle cx="550" cy="215" r="13"/><circle cx="465" cy="280" r="13"/></g><text x="480" y="340" text-anchor="middle" font-size="16" fill="#334155">哪些关系构成路径？</text><text x="480" y="380" text-anchor="middle" font-size="14" fill="#64748b">节点 + 边 + 社区</text><rect x="645" y="82" width="280" height="350" rx="22" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="785" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#047857">Agentic RAG</text><rect x="705" y="165" width="160" height="42" rx="10" fill="#a7f3d0"/><text x="785" y="192" text-anchor="middle" font-size="14" fill="#065f46">规划</text><rect x="705" y="225" width="160" height="42" rx="10" fill="#a7f3d0"/><text x="785" y="252" text-anchor="middle" font-size="14" fill="#065f46">选择工具</text><rect x="705" y="285" width="160" height="42" rx="10" fill="#a7f3d0"/><text x="785" y="312" text-anchor="middle" font-size="14" fill="#065f46">检查 + 重试</text><text x="785" y="360" text-anchor="middle" font-size="16" fill="#334155">下一步采取什么行动？</text><text x="785" y="395" text-anchor="middle" font-size="14" fill="#64748b">状态 + 策略 + 停止规则</text></g></svg>
