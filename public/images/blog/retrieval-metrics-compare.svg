<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Comparison of common retrieval metrics</title><desc id="desc">Precision, recall, MRR, and nDCG focus on noise, coverage, first relevant rank, and graded ranking quality.</desc><rect width="960" height="500" rx="28" fill="#f8fafc"/><text x="480" y="45" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Four metrics, four questions</text>
  <g font-family="Arial"><rect x="55" y="88" width="400" height="150" rx="20" fill="#eff6ff" stroke="#93c5fd"/><text x="85" y="128" font-size="21" font-weight="700" fill="#1d4ed8">Precision@k</text><text x="85" y="164" font-size="16" fill="#334155">How much of Top-k is relevant?</text><text x="85" y="202" font-size="14" fill="#64748b">Focus: noise in the returned set</text><rect x="505" y="88" width="400" height="150" rx="20" fill="#ecfdf5" stroke="#6ee7b7"/><text x="535" y="128" font-size="21" font-weight="700" fill="#047857">Recall@k</text><text x="535" y="164" font-size="16" fill="#334155">How much gold evidence was found?</text><text x="535" y="202" font-size="14" fill="#64748b">Focus: coverage and candidate ceiling</text><rect x="55" y="278" width="400" height="150" rx="20" fill="#fef3c7" stroke="#fbbf24"/><text x="85" y="318" font-size="21" font-weight="700" fill="#92400e">MRR</text><text x="85" y="354" font-size="16" fill="#334155">Where is the first relevant result?</text><text x="85" y="392" font-size="14" fill="#64748b">Focus: one-answer lookup</text><rect x="505" y="278" width="400" height="150" rx="20" fill="#f5f3ff" stroke="#c4b5fd"/><text x="535" y="318" font-size="21" font-weight="700" fill="#6d28d9">nDCG@k</text><text x="535" y="354" font-size="16" fill="#334155">Are highly useful results near the top?</text><text x="535" y="392" font-size="14" fill="#64748b">Focus: graded relevance and order</text></g></svg>
