<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="t d"><title id="t">Metadata as retrieval signal</title><desc id="d">A query uses year, document, and object-type metadata to filter a corpus before ranking evidence.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b"/></marker><style>.t{font:700 36px Inter,"Microsoft YaHei",Arial;fill:#0f172a}.h{font:700 21px Inter,"Microsoft YaHei",Arial;fill:#0f172a}.b{font:400 16px Inter,"Microsoft YaHei",Arial;fill:#475569}.a{stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1400" height="600" rx="28" fill="#f8fafc"/><text x="70" y="70" class="t">Metadata can narrow the search space</text><text x="70" y="108" class="b">Metadata is both provenance for citation and a retrieval signal for filtering.</text><rect x="70" y="180" width="300" height="260" rx="22" fill="white" stroke="#93c5fd" stroke-width="2"/><text x="220" y="225" text-anchor="middle" class="h">Query constraints</text><rect x="115" y="260" width="210" height="40" rx="12" fill="#eff6ff"/><text x="220" y="286" text-anchor="middle" class="b">year = 2017</text><rect x="115" y="315" width="210" height="40" rx="12" fill="#eff6ff"/><text x="220" y="341" text-anchor="middle" class="b">document = annual report</text><rect x="115" y="370" width="210" height="40" rx="12" fill="#eff6ff"/><text x="220" y="396" text-anchor="middle" class="b">object = table</text><line x1="370" y1="310" x2="455" y2="310" class="a"/><rect x="470" y="150" width="430" height="320" rx="22" fill="white" stroke="#c4b5fd" stroke-width="2"/><text x="685" y="195" text-anchor="middle" class="h">Longitudinal corpus</text><g fill="#f5f3ff"><rect x="520" y="230" width="150" height="55" rx="10"/><rect x="700" y="230" width="150" height="55" rx="10"/><rect x="520" y="305" width="150" height="55" rx="10"/><rect x="700" y="305" width="150" height="55" rx="10"/></g><text x="595" y="264" text-anchor="middle" class="b">2016 table</text><text x="775" y="264" text-anchor="middle" class="b">2017 paragraph</text><rect x="520" y="380" width="330" height="55" rx="10" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/><text x="685" y="414" text-anchor="middle" class="h">2017 table ✓</text><line x1="900" y1="310" x2="985" y2="310" class="a"/><rect x="1000" y="180" width="330" height="260" rx="22" fill="white" stroke="#86efac" stroke-width="2"/><text x="1165" y="225" text-anchor="middle" class="h">Ranked evidence</text><text x="1165" y="252" text-anchor="middle" class="b">Selected evidence</text><rect x="1045" y="290" width="240" height="80" rx="14" fill="#f0fdf4"/><text x="1165" y="323" text-anchor="middle" class="b">report_2017 · page_33</text><text x="1165" y="351" text-anchor="middle" class="b">table_candidate_01</text><text x="1165" y="405" text-anchor="middle" class="h">Searchable and citable</text><text x="700" y="535" text-anchor="middle" class="h">Use metadata to remove impossible results, then rank the remaining candidates by relevance.</text></svg>
