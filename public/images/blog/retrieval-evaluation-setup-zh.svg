<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">检索评价的基本设置</title><desc id="desc">一个查询对应已知的标准证据，并在指定截断位置评价排序结果。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#64748b"/></marker></defs><rect width="960" height="480" rx="28" fill="#f8fafc"/><text x="480" y="45" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">评价就是比较检索排名与证据标注</text>
  <rect x="45" y="100" width="250" height="90" rx="18" fill="#dbeafe" stroke="#60a5fa"/><text x="170" y="135" text-anchor="middle" font-family="Arial" font-size="15" fill="#1e3a8a">查询</text><text x="170" y="164" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#0f172a">q</text><rect x="45" y="230" width="250" height="150" rx="18" fill="#fef3c7" stroke="#f59e0b"/><text x="170" y="266" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">标准证据 Gq</text><text x="170" y="304" text-anchor="middle" font-family="Arial" font-size="16" fill="#0f172a">A · C · E</text><text x="170" y="342" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">已知相关对象</text><path d="M295 145H370" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <rect x="395" y="82" width="500" height="330" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="645" y="119" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a">排序结果 Rq</text><g font-family="Arial" font-size="16"><rect x="440" y="142" width="410" height="42" rx="10" fill="#dcfce7"/><text x="460" y="168" fill="#166534">1 · A · 相关</text><rect x="440" y="192" width="410" height="42" rx="10" fill="#fee2e2"/><text x="460" y="218" fill="#991b1b">2 · B · 不相关</text><rect x="440" y="242" width="410" height="42" rx="10" fill="#dcfce7"/><text x="460" y="268" fill="#166534">3 · C · 相关</text><rect x="440" y="292" width="410" height="42" rx="10" fill="#fee2e2"/><text x="460" y="318" fill="#991b1b">4 · D · 不相关</text><rect x="440" y="342" width="410" height="42" rx="10" fill="#dcfce7"/><text x="460" y="368" fill="#166534">5 · E · 相关</text></g><path d="M420 334H872" stroke="#f97316" stroke-width="3" stroke-dasharray="8 6"/><text x="860" y="325" text-anchor="end" font-family="Arial" font-size="13" font-weight="700" fill="#c2410c">截断位置 k=4</text></svg>
