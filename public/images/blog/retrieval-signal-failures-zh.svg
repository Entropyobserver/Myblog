<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">互补的检索成功与失败模式</title><desc id="desc">关键词检索和向量检索擅长不同类型的查询，也都可能返回错误证据。</desc>
  <rect width="960" height="470" rx="28" fill="#f8fafc"/><text x="480" y="46" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">同一语料，不同优势</text>
  <text x="330" y="96" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1d4ed8">BM25</text><text x="690" y="96" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#7c3aed">向量检索</text>
  <g font-family="Arial" font-size="15"><text x="60" y="151" fill="#334155">精确编号：BLOCK-17A</text><text x="60" y="231" fill="#334155">改写表达：“净利润”</text><text x="60" y="311" fill="#334155">内容近似，但年份错误</text><text x="60" y="391" fill="#334155">OCR 导致词项损坏</text></g>
  <g font-family="Arial" font-size="16" font-weight="700" text-anchor="middle"><rect x="245" y="120" width="170" height="48" rx="12" fill="#dcfce7"/><text x="330" y="150" fill="#166534">✓ 精确匹配</text><rect x="605" y="120" width="170" height="48" rx="12" fill="#fee2e2"/><text x="690" y="150" fill="#991b1b">△ 可能混淆</text><rect x="245" y="200" width="170" height="48" rx="12" fill="#fee2e2"/><text x="330" y="230" fill="#991b1b">✕ 没有词项重合</text><rect x="605" y="200" width="170" height="48" rx="12" fill="#dcfce7"/><text x="690" y="230" fill="#166534">✓ 语义匹配</text><rect x="245" y="280" width="170" height="48" rx="12" fill="#fef3c7"/><text x="330" y="310" fill="#92400e">△ 年份可能有帮助</text><rect x="605" y="280" width="170" height="48" rx="12" fill="#fee2e2"/><text x="690" y="310" fill="#991b1b">✕ 相似但危险</text><rect x="245" y="360" width="170" height="48" rx="12" fill="#fee2e2"/><text x="330" y="390" fill="#991b1b">✕ 词项缺失</text><rect x="605" y="360" width="170" height="48" rx="12" fill="#fef3c7"/><text x="690" y="390" fill="#92400e">△ 可能恢复</text></g>
