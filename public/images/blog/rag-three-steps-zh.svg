<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">RAG 的三个基本步骤</title>
  <desc id="desc">用户问题依次经过检索、增强和生成，得到带有证据依据的答案。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".1"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b"/></marker>
    <style>.t{font:700 38px Inter,"Microsoft YaHei",sans-serif;fill:#0f172a}.st{font:400 19px Inter,"Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 25px Inter,"Microsoft YaHei",sans-serif;fill:#0f172a}.b{font:400 18px Inter,"Microsoft YaHei",sans-serif;fill:#475569}.n{font:700 19px Inter,"Microsoft YaHei",sans-serif;fill:white}.ar{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1400" height="700" rx="28" fill="url(#bg)"/>
  <text x="70" y="74" class="t">RAG = Retrieval + Augmentation + Generation</text>
  <text x="70" y="112" class="st">先找到外部证据，再把证据交给语言模型生成回答。</text>
  <g filter="url(#s)">
    <rect x="70" y="190" width="210" height="270" rx="24" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="175" cy="260" r="38" fill="#dbeafe"/><text x="175" y="267" text-anchor="middle" class="h" fill="#2563eb">?</text>
    <text x="175" y="330" text-anchor="middle" class="h">用户问题</text>
    <text x="175" y="370" text-anchor="middle" class="b">“2017 年的比例</text><text x="175" y="400" text-anchor="middle" class="b">是多少？”</text>
  </g>
  <path d="M280 325H340" class="ar"/>
  <g filter="url(#s)">
    <rect x="355" y="170" width="260" height="310" rx="24" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="405" cy="220" r="25" fill="#7c3aed"/><text x="405" y="227" text-anchor="middle" class="n">1</text>
    <text x="445" y="228" class="h">Retrieval</text>
    <text x="485" y="276" text-anchor="middle" class="b">从知识库中搜索</text>
    <rect x="405" y="310" width="160" height="38" rx="12" fill="#f5f3ff"/><text x="485" y="335" text-anchor="middle" class="b">报告 / 页面</text>
    <rect x="405" y="365" width="160" height="38" rx="12" fill="#f5f3ff"/><text x="485" y="390" text-anchor="middle" class="b">段落 / 表格</text>
    <text x="485" y="440" text-anchor="middle" class="st">找到候选证据</text>
  </g>
  <path d="M615 325H675" class="ar"/>
  <g filter="url(#s)">
    <rect x="690" y="170" width="260" height="310" rx="24" fill="#fff" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="740" cy="220" r="25" fill="#0891b2"/><text x="740" y="227" text-anchor="middle" class="n">2</text>
    <text x="780" y="228" class="h">Augmentation</text>
    <text x="820" y="276" text-anchor="middle" class="b">把问题和证据组合</text>
    <rect x="735" y="310" width="170" height="104" rx="14" fill="#ecfeff"/>
    <text x="820" y="342" text-anchor="middle" class="b">问题</text><text x="820" y="368" text-anchor="middle" class="h">＋</text><text x="820" y="397" text-anchor="middle" class="b">检索证据</text>
    <text x="820" y="447" text-anchor="middle" class="st">形成增强提示</text>
  </g>
  <path d="M950 325H1010" class="ar"/>
  <g filter="url(#s)">
    <rect x="1025" y="170" width="305" height="310" rx="24" fill="#fff" stroke="#86efac" stroke-width="2"/>
    <circle cx="1075" cy="220" r="25" fill="#16a34a"/><text x="1075" y="227" text-anchor="middle" class="n">3</text>
    <text x="1115" y="228" class="h">Generation</text>
    <text x="1177" y="276" text-anchor="middle" class="b">模型依据上下文回答</text>
    <rect x="1070" y="310" width="215" height="104" rx="14" fill="#ecfdf5"/>
    <text x="1177" y="350" text-anchor="middle" class="h">36%</text><text x="1177" y="385" text-anchor="middle" class="b">来源：报告第 33 页</text>
    <text x="1177" y="447" text-anchor="middle" class="st">答案可追溯</text>
  </g>
  <rect x="355" y="545" width="975" height="74" rx="18" fill="#e0f2fe"/>
  <text x="842" y="590" text-anchor="middle" class="h">关键：RAG 增加的是回答时可访问的外部证据，而不是重新训练模型。</text>
</svg>
