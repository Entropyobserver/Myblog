<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">没有 RAG 与使用 RAG 的区别</title>
  <desc id="desc">没有 RAG 时模型主要依赖参数中的训练知识；使用 RAG 时，模型还能读取检索到的外部证据并提供引用。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#fff7ed"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0f172a" flood-opacity=".1"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b"/></marker><style>.t{font:700 38px Inter,"Microsoft YaHei",sans-serif;fill:#0f172a}.h{font:700 26px Inter,"Microsoft YaHei",sans-serif;fill:#0f172a}.b{font:400 18px Inter,"Microsoft YaHei",sans-serif;fill:#475569}.g{font:700 18px Inter,"Microsoft YaHei",sans-serif;fill:#15803d}.r{font:700 18px Inter,"Microsoft YaHei",sans-serif;fill:#b45309}.ar{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="74" class="t">RAG 不会替换语言模型，而是给它增加外部证据</text>
  <g filter="url(#s)"><rect x="70" y="130" width="600" height="535" rx="26" fill="#fff" stroke="#fdba74" stroke-width="2"/></g>
  <text x="370" y="185" text-anchor="middle" class="h">没有 RAG</text>
  <rect x="135" y="225" width="190" height="76" rx="18" fill="#fff7ed"/><text x="230" y="270" text-anchor="middle" class="h">用户问题</text>
  <path d="M325 263H405" class="ar"/>
  <rect x="420" y="215" width="185" height="96" rx="48" fill="#ffedd5"/><text x="512" y="254" text-anchor="middle" class="h">LLM</text><text x="512" y="282" text-anchor="middle" class="b">参数知识</text>
  <path d="M512 311V370" class="ar"/>
  <rect x="175" y="385" width="390" height="120" rx="20" fill="#fff7ed"/>
  <text x="370" y="425" text-anchor="middle" class="b">知识可能过时、缺少私有数据，</text><text x="370" y="457" text-anchor="middle" class="b">也无法指出答案来自哪一页。</text>
  <text x="370" y="545" text-anchor="middle" class="r">风险：流畅，但依据不可见</text>
  <text x="370" y="608" text-anchor="middle" class="b">训练知识写在模型参数中</text>
  <g filter="url(#s)"><rect x="730" y="130" width="600" height="535" rx="26" fill="#fff" stroke="#86efac" stroke-width="2"/></g>
  <text x="1030" y="185" text-anchor="middle" class="h">使用 RAG</text>
  <rect x="785" y="225" width="170" height="76" rx="18" fill="#f0fdf4"/><text x="870" y="270" text-anchor="middle" class="h">用户问题</text>
  <path d="M955 263H1010" class="ar"/>
  <rect x="1025" y="215" width="240" height="96" rx="20" fill="#dcfce7"/><text x="1145" y="252" text-anchor="middle" class="h">检索器</text><text x="1145" y="281" text-anchor="middle" class="b">查找外部知识库</text>
  <path d="M1145 311V363" class="ar"/>
  <rect x="785" y="375" width="210" height="105" rx="20" fill="#ecfdf5"/><text x="890" y="416" text-anchor="middle" class="h">外部证据</text><text x="890" y="449" text-anchor="middle" class="b">报告 · 页码 · 表格</text>
  <path d="M995 427H1040" class="ar"/>
  <rect x="1055" y="375" width="210" height="105" rx="52" fill="#d1fae5"/><text x="1160" y="416" text-anchor="middle" class="h">LLM</text><text x="1160" y="449" text-anchor="middle" class="b">问题 + 证据</text>
  <path d="M1160 480V525" class="ar"/>
  <rect x="905" y="540" width="350" height="66" rx="18" fill="#f0fdf4"/><text x="1080" y="581" text-anchor="middle" class="g">答案可以引用并检查来源</text>
  <text x="1030" y="637" text-anchor="middle" class="b">外部知识可独立更新，无需重新训练 LLM</text>
</svg>
