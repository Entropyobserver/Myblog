<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Retrieve and rerank funnel</title><desc id="desc">A fast retriever reduces a large corpus to candidates, then a cross-encoder produces a smaller ranked context.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#64748b"/></marker></defs><rect width="960" height="500" rx="28" fill="#f8fafc"/><text x="480" y="46" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Fast coverage first, careful comparison second</text>
  <path d="M100 108H860L720 238H240Z" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="480" y="150" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#1e3a8a">Corpus · 1,000,000 chunks</text><text x="480" y="182" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155">BM25 / bi-encoder / hybrid search</text>
  <path d="M240 258H720L630 360H330Z" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="480" y="298" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#5b21b6">100 candidates</text><text x="480" y="329" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155">Cross-encoder: [query ; candidate]</text>
  <rect x="360" y="390" width="240" height="70" rx="18" fill="#d1fae5" stroke="#34d399" stroke-width="2"/><text x="480" y="420" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#065f46">Top-5 context</text><text x="480" y="446" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">selected evidence</text><path d="M480 238V254M480 360V385" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="770" y="286" font-family="Arial" font-size="14" fill="#475569">Higher cost</text><text x="770" y="309" font-family="Arial" font-size="14" fill="#475569">Higher precision</text></svg>
