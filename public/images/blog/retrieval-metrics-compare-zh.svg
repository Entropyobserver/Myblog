<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">常见检索指标对比</title><desc id="desc">Precision、Recall、MRR 和 nDCG 分别关注噪声、覆盖率、首个相关结果与分级排序质量。</desc><rect width="960" height="500" rx="28" fill="#f8fafc"/><text x="480" y="45" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">四个指标，四个问题</text>
  <g font-family="Arial"><rect x="55" y="88" width="400" height="150" rx="20" fill="#eff6ff" stroke="#93c5fd"/><text x="85" y="128" font-size="21" font-weight="700" fill="#1d4ed8">Precision@k</text><text x="85" y="164" font-size="16" fill="#334155">Top-k 中有多少是相关结果？</text><text x="85" y="202" font-size="14" fill="#64748b">关注：返回集合中的噪声</text><rect x="505" y="88" width="400" height="150" rx="20" fill="#ecfdf5" stroke="#6ee7b7"/><text x="535" y="128" font-size="21" font-weight="700" fill="#047857">Recall@k</text><text x="535" y="164" font-size="16" fill="#334155">找到了多少标准证据？</text><text x="535" y="202" font-size="14" fill="#64748b">关注：覆盖率与候选上限</text><rect x="55" y="278" width="400" height="150" rx="20" fill="#fef3c7" stroke="#fbbf24"/><text x="85" y="318" font-size="21" font-weight="700" fill="#92400e">MRR</text><text x="85" y="354" font-size="16" fill="#334155">第一个相关结果排在哪里？</text><text x="85" y="392" font-size="14" fill="#64748b">关注：单答案查找</text><rect x="505" y="278" width="400" height="150" rx="20" fill="#f5f3ff" stroke="#c4b5fd"/><text x="535" y="318" font-size="21" font-weight="700" fill="#6d28d9">nDCG@k</text><text x="535" y="354" font-size="16" fill="#334155">高价值结果是否排在前面？</text><text x="535" y="392" font-size="14" fill="#64748b">关注：分级相关性与顺序</text></g></svg>
