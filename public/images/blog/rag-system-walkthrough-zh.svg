<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">从年报文档到有引用答案的 RAG 系统</title>
  <desc id="desc">上半部分展示离线知识准备，下半部分展示在线问答，并标出 Corpus、Document、Evidence object、Chunk、Metadata、Index、Query、Candidate、Context 和 Answer 的位置。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc" />
      <stop offset="1" stop-color="#eef6ff" />
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".09" /></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b" /></marker>
    <style>
      .title{font:700 34px Inter,"Microsoft YaHei",Arial,sans-serif;fill:#0f172a}.subtitle{font:400 18px Inter,"Microsoft YaHei",Arial,sans-serif;fill:#475569}.lane{font:700 20px Inter,"Microsoft YaHei",Arial,sans-serif;fill:#334155}.head{font:700 19px Inter,"Microsoft YaHei",Arial,sans-serif;fill:#0f172a}.body{font:400 16px Inter,"Microsoft YaHei",Arial,sans-serif;fill:#475569}.small{font:400 14px Inter,"Microsoft YaHei",Arial,sans-serif;fill:#64748b}.num{font:700 15px Inter,"Microsoft YaHei",Arial,sans-serif;fill:#fff}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="900" rx="28" fill="url(#bg)" />
  <text x="48" y="58" class="title">一张图看懂：RAG 是怎样协作的系统</text>
  <text x="48" y="90" class="subtitle">同一个年报问题，如何从原始文档走向“36% + 第 33 页”</text>

  <text x="48" y="135" class="lane">离线知识准备 · 问题出现之前</text>
  <g filter="url(#shadow)">
    <g><rect x="35" y="160" width="200" height="190" rx="20" fill="#fff" stroke="#93c5fd" stroke-width="2"/><circle cx="65" cy="190" r="18" fill="#2563eb"/><text x="65" y="196" text-anchor="middle" class="num">1</text><text x="135" y="198" text-anchor="middle" class="head">Corpus</text><text x="135" y="238" text-anchor="middle" class="body">允许搜索的全集</text><text x="135" y="275" text-anchor="middle" class="small">15 年年报</text><text x="135" y="300" text-anchor="middle" class="small">所有 PDF 页面</text></g>
    <g><rect x="270" y="160" width="200" height="190" rx="20" fill="#fff" stroke="#67e8f9" stroke-width="2"/><circle cx="300" cy="190" r="18" fill="#0891b2"/><text x="300" y="196" text-anchor="middle" class="num">2</text><text x="370" y="198" text-anchor="middle" class="head">Document</text><text x="370" y="238" text-anchor="middle" class="body">一份原始来源</text><text x="370" y="275" text-anchor="middle" class="small">2017 年年度报告</text><text x="370" y="300" text-anchor="middle" class="small">保留文档身份</text></g>
    <g><rect x="505" y="160" width="200" height="190" rx="20" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><circle cx="535" cy="190" r="18" fill="#7c3aed"/><text x="535" y="196" text-anchor="middle" class="num">3</text><text x="605" y="193" text-anchor="middle" class="head">Evidence</text><text x="605" y="216" text-anchor="middle" class="head">object</text><text x="605" y="255" text-anchor="middle" class="body">可追溯的内容对象</text><text x="605" y="290" text-anchor="middle" class="small">段落 · 表格 · 标题</text><text x="605" y="315" text-anchor="middle" class="small">来自具体页码</text></g>
    <g><rect x="740" y="160" width="200" height="190" rx="20" fill="#fff" stroke="#fcd34d" stroke-width="2"/><circle cx="770" cy="190" r="18" fill="#d97706"/><text x="770" y="196" text-anchor="middle" class="num">4</text><text x="840" y="192" text-anchor="middle" class="head">Chunk</text><text x="840" y="219" text-anchor="middle" class="head">+ Metadata</text><text x="840" y="258" text-anchor="middle" class="body">可检索内容单元</text><text x="840" y="292" text-anchor="middle" class="small">文本 + 年份 + 页码</text><text x="840" y="317" text-anchor="middle" class="small">+ 类型 + 来源</text></g>
    <g><rect x="975" y="160" width="190" height="190" rx="20" fill="#fff" stroke="#86efac" stroke-width="2"/><circle cx="1005" cy="190" r="18" fill="#16a34a"/><text x="1005" y="196" text-anchor="middle" class="num">5</text><text x="1070" y="198" text-anchor="middle" class="head">Index</text><text x="1070" y="238" text-anchor="middle" class="body">加速搜索</text><text x="1070" y="275" text-anchor="middle" class="small">关键词索引</text><text x="1070" y="300" text-anchor="middle" class="small">向量索引</text></g>
  </g>
  <path d="M235 255H260" class="arrow"/><path d="M470 255H495" class="arrow"/><path d="M705 255H730" class="arrow"/><path d="M940 255H965" class="arrow"/>

  <path d="M1070 350V405H145V485" class="arrow"/>
  <text x="48" y="455" class="lane">在线问答 · 每次用户提问时</text>
  <g filter="url(#shadow)">
    <g><rect x="35" y="490" width="200" height="225" rx="20" fill="#fff" stroke="#93c5fd" stroke-width="2"/><circle cx="65" cy="520" r="18" fill="#2563eb"/><text x="65" y="526" text-anchor="middle" class="num">6</text><text x="135" y="528" text-anchor="middle" class="head">Query</text><text x="135" y="570" text-anchor="middle" class="body">用于搜索的表达</text><text x="135" y="612" text-anchor="middle" class="small">2017 · 安哥拉</text><text x="135" y="637" text-anchor="middle" class="small">三个区块</text><text x="135" y="662" text-anchor="middle" class="small">权益液体产量</text></g>
    <g><rect x="270" y="490" width="200" height="225" rx="20" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><circle cx="300" cy="520" r="18" fill="#7c3aed"/><text x="300" y="526" text-anchor="middle" class="num">7</text><text x="370" y="520" text-anchor="middle" class="head">Retriever</text><text x="370" y="546" text-anchor="middle" class="head">→ Candidates</text><text x="370" y="586" text-anchor="middle" class="body">返回可能相关结果</text><text x="370" y="626" text-anchor="middle" class="small">2016 表格</text><text x="370" y="651" text-anchor="middle" class="small">2017 表格</text><text x="370" y="676" text-anchor="middle" class="small">2018 表格</text></g>
    <g><rect x="505" y="490" width="200" height="225" rx="20" fill="#fff" stroke="#67e8f9" stroke-width="2"/><circle cx="535" cy="520" r="18" fill="#0891b2"/><text x="535" y="526" text-anchor="middle" class="num">8</text><text x="605" y="520" text-anchor="middle" class="head">Context</text><text x="605" y="546" text-anchor="middle" class="head">builder</text><text x="605" y="586" text-anchor="middle" class="body">过滤 · 可选重排</text><text x="605" y="626" text-anchor="middle" class="small">保留 2017 表格</text><text x="605" y="651" text-anchor="middle" class="small">保留第 33 页</text><text x="605" y="676" text-anchor="middle" class="small">形成最终 Context</text></g>
    <g><rect x="740" y="490" width="200" height="225" rx="20" fill="#fff" stroke="#86efac" stroke-width="2"/><circle cx="770" cy="520" r="18" fill="#16a34a"/><text x="770" y="526" text-anchor="middle" class="num">9</text><text x="840" y="520" text-anchor="middle" class="head">Generator</text><text x="840" y="546" text-anchor="middle" class="head">→ Answer</text><text x="840" y="590" text-anchor="middle" class="body">依据 Context 回答</text><text x="840" y="640" text-anchor="middle" class="head">36%</text><text x="840" y="675" text-anchor="middle" class="small">来源：第 33 页</text></g>
    <g><rect x="975" y="490" width="190" height="225" rx="20" fill="#fff" stroke="#fdba74" stroke-width="2"/><circle cx="1005" cy="520" r="18" fill="#ea580c"/><text x="1005" y="526" text-anchor="middle" class="num">10</text><text x="1070" y="520" text-anchor="middle" class="head">Verify</text><text x="1070" y="546" text-anchor="middle" class="small">可选控制环节</text><text x="1070" y="590" text-anchor="middle" class="body">年份正确？</text><text x="1070" y="620" text-anchor="middle" class="body">证据充分？</text><text x="1070" y="650" text-anchor="middle" class="body">引用支持答案？</text><text x="1070" y="682" text-anchor="middle" class="small">接受 · 重试 · 拒答</text></g>
  </g>
  <path d="M235 602H260" class="arrow"/><path d="M470 602H495" class="arrow"/><path d="M705 602H730" class="arrow"/><path d="M940 602H965" class="arrow"/>
  <rect x="80" y="780" width="1040" height="72" rx="18" fill="#e0f2fe" />
  <text x="600" y="812" text-anchor="middle" class="head">对象在不断改变：Document → Chunk → Candidate → Context → Answer</text>
  <text x="600" y="839" text-anchor="middle" class="body">Candidate 只是候选；经过选择并交给模型后，它才成为 Context 的一部分。</text>
</svg>
