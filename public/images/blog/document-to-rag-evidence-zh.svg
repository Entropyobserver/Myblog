<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="t d"><title id="t">从文档到可检索证据</title><desc id="d">PDF 经过结构解析、元数据补充、切分、表示和索引，最终成为可检索证据。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b"/></marker><style>.t{font:700 36px Inter,"Microsoft YaHei",Arial;fill:#0f172a}.h{font:700 21px Inter,"Microsoft YaHei",Arial;fill:#0f172a}.b{font:400 15px Inter,"Microsoft YaHei",Arial;fill:#475569}.a{stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1400" height="650" rx="28" fill="#f8fafc"/><text x="70" y="70" class="t">PDF 不是纯文本文件</text><text x="70" y="108" class="b">搜索开始前，处理流程必须保留内容、结构和来源。</text><g>
<rect x="55" y="180" width="185" height="270" rx="22" fill="white" stroke="#93c5fd" stroke-width="2"/><path d="M105 225h85v125h-85zM120 250h55M120 275h55M120 300h40" fill="none" stroke="#2563eb" stroke-width="4"/><text x="147" y="395" text-anchor="middle" class="h">原始 PDF</text><text x="147" y="422" text-anchor="middle" class="b">原始文档</text><line x1="240" y1="315" x2="285" y2="315" class="a"/>
<rect x="300" y="180" width="210" height="270" rx="22" fill="white" stroke="#67e8f9" stroke-width="2"/><text x="405" y="225" text-anchor="middle" class="h">解析结构</text><rect x="340" y="255" width="130" height="35" rx="10" fill="#ecfeff"/><text x="405" y="278" text-anchor="middle" class="b">阅读顺序</text><rect x="340" y="305" width="130" height="35" rx="10" fill="#ecfeff"/><text x="405" y="328" text-anchor="middle" class="b">表格与图片</text><rect x="340" y="355" width="130" height="35" rx="10" fill="#ecfeff"/><text x="405" y="378" text-anchor="middle" class="b">页眉与页脚</text><line x1="510" y1="315" x2="555" y2="315" class="a"/>
<rect x="570" y="180" width="210" height="270" rx="22" fill="white" stroke="#c4b5fd" stroke-width="2"/><text x="675" y="225" text-anchor="middle" class="h">证据对象</text><text x="675" y="251" text-anchor="middle" class="b">可追溯内容单元</text><rect x="610" y="280" width="130" height="35" rx="10" fill="#f5f3ff"/><text x="675" y="303" text-anchor="middle" class="b">标题</text><rect x="610" y="330" width="130" height="35" rx="10" fill="#f5f3ff"/><text x="675" y="353" text-anchor="middle" class="b">段落</text><rect x="610" y="380" width="130" height="35" rx="10" fill="#f5f3ff"/><text x="675" y="403" text-anchor="middle" class="b">表格</text><line x1="780" y1="315" x2="825" y2="315" class="a"/>
<rect x="840" y="180" width="210" height="270" rx="22" fill="white" stroke="#fcd34d" stroke-width="2"/><text x="945" y="225" text-anchor="middle" class="h">切分并补充上下文</text><text x="945" y="251" text-anchor="middle" class="b">构造检索单元</text><rect x="880" y="285" width="130" height="42" rx="10" fill="#fffbeb"/><text x="945" y="312" text-anchor="middle" class="b">长度限制</text><rect x="880" y="345" width="130" height="42" rx="10" fill="#fffbeb"/><text x="945" y="372" text-anchor="middle" class="b">标题 + 图表说明</text><line x1="1050" y1="315" x2="1095" y2="315" class="a"/>
<rect x="1110" y="180" width="235" height="270" rx="22" fill="white" stroke="#86efac" stroke-width="2"/><text x="1227" y="225" text-anchor="middle" class="h">表示与索引</text><text x="1227" y="251" text-anchor="middle" class="b">建立搜索入口</text><rect x="1150" y="285" width="155" height="42" rx="10" fill="#f0fdf4"/><text x="1227" y="312" text-anchor="middle" class="b">关键词表示</text><rect x="1150" y="345" width="155" height="42" rx="10" fill="#f0fdf4"/><text x="1227" y="372" text-anchor="middle" class="b">向量表示</text></g><rect x="300" y="505" width="1045" height="70" rx="17" fill="#e0f2fe"/><text x="822" y="535" text-anchor="middle" class="h">每个检索结果都必须能回到来源</text><text x="822" y="560" text-anchor="middle" class="b">document_id · year · page · object_id · object_type</text></svg>
