<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">部分证据与完整证据</title><desc id="desc">一个问题需要 A、B、C 三项证据；一次检索只找到两项，另一次找全三项。</desc><rect width="960" height="450" rx="28" fill="#f8fafc"/><text x="480" y="45" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">找到证据不等于找全证据</text><text x="480" y="84" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">问题需要证据集合 Gq = { A, B, C }</text>
  <rect x="65" y="120" width="380" height="260" rx="22" fill="#fff" stroke="#fecaca" stroke-width="2"/><text x="255" y="158" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#b91c1c">部分检索成功</text><g font-family="Arial" font-size="18" font-weight="700" text-anchor="middle"><circle cx="160" cy="240" r="42" fill="#dcfce7"/><text x="160" y="247" fill="#166534">A ✓</text><circle cx="255" cy="240" r="42" fill="#dcfce7"/><text x="255" y="247" fill="#166534">B ✓</text><circle cx="350" cy="240" r="42" fill="#fee2e2"/><text x="350" y="247" fill="#991b1b">C ✕</text></g><text x="255" y="330" text-anchor="middle" font-family="Arial" font-size="16" fill="#991b1b">Recall = 2/3 · Complete = 0</text>
  <rect x="515" y="120" width="380" height="260" rx="22" fill="#fff" stroke="#86efac" stroke-width="2"/><text x="705" y="158" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#15803d">完整检索成功</text><g font-family="Arial" font-size="18" font-weight="700" text-anchor="middle"><circle cx="610" cy="240" r="42" fill="#dcfce7"/><text x="610" y="247" fill="#166534">A ✓</text><circle cx="705" cy="240" r="42" fill="#dcfce7"/><text x="705" y="247" fill="#166534">B ✓</text><circle cx="800" cy="240" r="42" fill="#dcfce7"/><text x="800" y="247" fill="#166534">C ✓</text></g><text x="705" y="330" text-anchor="middle" font-family="Arial" font-size="16" fill="#166534">Recall = 3/3 · Complete = 1</text></svg>
