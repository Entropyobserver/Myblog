<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="t d"><title id="t">RAG 评价的三个层级</title><desc id="d">RAG 评价需要分别检查检索排序、证据正确性与完整性，以及最终答案质量。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b"/></marker><style>.t{font:700 36px Inter,"Microsoft YaHei",Arial;fill:#0f172a}.h{font:700 23px Inter,"Microsoft YaHei",Arial;fill:#0f172a}.b{font:400 16px Inter,"Microsoft YaHei",Arial;fill:#475569}.a{stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1400" height="610" rx="28" fill="#f8fafc"/><text x="70" y="70" class="t">不要只看最终答案</text><text x="70" y="106" class="b">答案正确可能掩盖错误证据；答案错误也可能始于一次成功的检索。</text><g><rect x="70" y="170" width="360" height="315" rx="24" fill="white" stroke="#c4b5fd" stroke-width="2"/><text x="250" y="220" text-anchor="middle" class="h">1 · 检索质量</text><text x="250" y="250" text-anchor="middle" class="b">候选与排序质量</text><rect x="115" y="290" width="270" height="48" rx="12" fill="#f5f3ff"/><text x="250" y="320" text-anchor="middle" class="b">Recall@k · Precision@k</text><rect x="115" y="355" width="270" height="48" rx="12" fill="#f5f3ff"/><text x="250" y="385" text-anchor="middle" class="b">MRR · nDCG</text><text x="250" y="445" text-anchor="middle" class="b">正确对象是否进入 Top-k？</text><line x1="430" y1="327" x2="505" y2="327" class="a"/>
<rect x="520" y="170" width="360" height="315" rx="24" fill="white" stroke="#86efac" stroke-width="2"/><text x="700" y="220" text-anchor="middle" class="h">2 · 证据质量</text><text x="700" y="250" text-anchor="middle" class="b">证据正确性与完整性</text><rect x="565" y="290" width="270" height="48" rx="12" fill="#f0fdf4"/><text x="700" y="320" text-anchor="middle" class="b">正确报告 · 页码 · 对象</text><rect x="565" y="355" width="270" height="48" rx="12" fill="#f0fdf4"/><text x="700" y="385" text-anchor="middle" class="b">部分证据与完整证据</text><text x="700" y="445" text-anchor="middle" class="b">回答所需证据是否找全？</text><line x1="880" y1="327" x2="955" y2="327" class="a"/>
<rect x="970" y="170" width="360" height="315" rx="24" fill="white" stroke="#67e8f9" stroke-width="2"/><text x="1150" y="220" text-anchor="middle" class="h">3 · 答案质量</text><text x="1150" y="250" text-anchor="middle" class="b">最终回答质量</text><rect x="1015" y="290" width="270" height="48" rx="12" fill="#ecfeff"/><text x="1150" y="320" text-anchor="middle" class="b">正确性 · 相关性</text><rect x="1015" y="355" width="270" height="48" rx="12" fill="#ecfeff"/><text x="1150" y="385" text-anchor="middle" class="b">忠实性 · 引用</text><text x="1150" y="445" text-anchor="middle" class="b">结论是否被证据支持？</text></g><text x="700" y="555" text-anchor="middle" class="h">答案正确 ≠ 检索正确 ≠ 证据完整</text></svg>
