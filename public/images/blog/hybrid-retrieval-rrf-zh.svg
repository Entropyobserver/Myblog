<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">使用倒数排名融合的混合检索</title><desc id="desc">RRF 将 BM25 与向量检索排名融合为一份去重后的候选列表。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#64748b"/></marker></defs><rect width="960" height="520" rx="28" fill="#f8fafc"/><text x="480" y="45" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Hybrid Retrieval：融合排名，保留证据</text>
  <rect x="65" y="92" width="240" height="330" rx="20" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="185" y="126" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#1d4ed8">BM25 排名</text><g font-family="Arial" font-size="15"><text x="95" y="174" fill="#0f172a">1  2017 年表格</text><text x="95" y="222" fill="#0f172a">2  安哥拉说明</text><text x="95" y="270" fill="#0f172a">3  2016 年表格</text><text x="95" y="318" fill="#0f172a">4  区块术语表</text></g>
  <rect x="360" y="92" width="240" height="330" rx="20" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><text x="480" y="126" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#7c3aed">向量检索排名</text><g font-family="Arial" font-size="15"><text x="390" y="174" fill="#0f172a">1  2016 年表格</text><text x="390" y="222" fill="#0f172a">2  2017 年表格</text><text x="390" y="270" fill="#0f172a">3  产量摘要</text><text x="390" y="318" fill="#0f172a">4  安哥拉说明</text></g>
  <path d="M305 255H338M600 255H633" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><circle cx="666" cy="255" r="48" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="666" y="250" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">RRF</text><text x="666" y="272" text-anchor="middle" font-family="Arial" font-size="12" fill="#92400e">+ 去重</text><path d="M714 255H741" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <rect x="755" y="92" width="150" height="330" rx="20" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="830" y="126" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#047857">融合结果</text><g font-family="Arial" font-size="14"><text x="780" y="174" fill="#0f172a">1  2017 年表格</text><text x="780" y="222" fill="#0f172a">2  2016 年表格</text><text x="780" y="270" fill="#0f172a">3  安哥拉说明</text><text x="780" y="318" fill="#0f172a">4  摘要</text></g><rect x="135" y="450" width="690" height="42" rx="12" fill="#e0f2fe"/><text x="480" y="477" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0c4a6e">融合提高候选覆盖率，但不会自动核验年份</text></svg>
