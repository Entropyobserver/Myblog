<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">检索与重排序漏斗</title><desc id="desc">快速检索器先从大规模语料生成候选，Cross-Encoder 再得到更小的排序上下文。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#64748b"/></marker></defs><rect width="960" height="500" rx="28" fill="#f8fafc"/><text x="480" y="46" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">先快速覆盖，再仔细比较</text>
  <path d="M100 108H860L720 238H240Z" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="480" y="150" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#1e3a8a">语料库 · 1,000,000 个 chunks</text><text x="480" y="182" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155">BM25 / 双编码器 / 混合检索</text>
  <path d="M240 258H720L630 360H330Z" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="480" y="298" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#5b21b6">100 个候选</text><text x="480" y="329" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155">Cross-Encoder：[查询；候选]</text>
  <rect x="360" y="390" width="240" height="70" rx="18" fill="#d1fae5" stroke="#34d399" stroke-width="2"/><text x="480" y="420" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#065f46">Top-5 上下文</text><text x="480" y="446" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">选定证据</text><path d="M480 238V254M480 360V385" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="770" y="286" font-family="Arial" font-size="14" fill="#475569">成本更高</text><text x="770" y="309" font-family="Arial" font-size="14" fill="#475569">精确率更高</text></svg>
