<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">RAG 的离线准备与在线问答</title>
  <desc id="desc">离线阶段处理文档并建立索引，在线阶段接收问题、检索证据并生成答案。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f0fdfa"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity=".09"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b"/></marker><style>.t{font:700 38px Inter,"Microsoft YaHei",sans-serif;fill:#0f172a}.h{font:700 24px Inter,"Microsoft YaHei",sans-serif;fill:#0f172a}.b{font:400 17px Inter,"Microsoft YaHei",sans-serif;fill:#475569}.p{font:700 18px Inter,"Microsoft YaHei",sans-serif;fill:#0f766e}.ar{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="74" class="t">一个完整 RAG 系统其实有两个阶段</text>
  <g filter="url(#s)"><rect x="70" y="135" width="1260" height="240" rx="25" fill="#fff" stroke="#93c5fd" stroke-width="2"/></g>
  <rect x="95" y="160" width="190" height="45" rx="14" fill="#dbeafe"/><text x="190" y="190" text-anchor="middle" class="h">离线准备</text>
  <text x="315" y="190" class="b">文档更新时运行：把原始文件变成可搜索的知识库</text>
  <g>
    <rect x="115" y="245" width="175" height="78" rx="17" fill="#eff6ff"/><text x="202" y="278" text-anchor="middle" class="h">PDF</text><text x="202" y="305" text-anchor="middle" class="b">原始文档</text>
    <path d="M290 284H350" class="ar"/>
    <rect x="365" y="245" width="190" height="78" rx="17" fill="#eff6ff"/><text x="460" y="278" text-anchor="middle" class="h">解析</text><text x="460" y="305" text-anchor="middle" class="b">文字 · 表格 · 布局</text>
    <path d="M555 284H615" class="ar"/>
    <rect x="630" y="245" width="190" height="78" rx="17" fill="#eff6ff"/><text x="725" y="278" text-anchor="middle" class="h">切分</text><text x="725" y="305" text-anchor="middle" class="b">Chunks + metadata</text>
    <path d="M820 284H880" class="ar"/>
    <rect x="895" y="245" width="190" height="78" rx="17" fill="#eff6ff"/><text x="990" y="278" text-anchor="middle" class="h">表示</text><text x="990" y="305" text-anchor="middle" class="b">词项 / Embeddings</text>
    <path d="M1085 284H1145" class="ar"/>
    <rect x="1160" y="245" width="140" height="78" rx="17" fill="#dbeafe"/><text x="1230" y="278" text-anchor="middle" class="h">索引</text><text x="1230" y="305" text-anchor="middle" class="b">可搜索</text>
  </g>
  <g filter="url(#s)"><rect x="70" y="415" width="1260" height="250" rx="25" fill="#fff" stroke="#5eead4" stroke-width="2"/></g>
  <rect x="95" y="440" width="190" height="45" rx="14" fill="#ccfbf1"/><text x="190" y="470" text-anchor="middle" class="h">在线问答</text>
  <text x="315" y="470" class="b">每次提问时运行：实时寻找证据并生成回答</text>
  <g>
    <rect x="115" y="530" width="175" height="78" rx="17" fill="#f0fdfa"/><text x="202" y="563" text-anchor="middle" class="h">问题</text><text x="202" y="590" text-anchor="middle" class="b">Query</text>
    <path d="M290 569H350" class="ar"/>
    <rect x="365" y="530" width="190" height="78" rx="17" fill="#f0fdfa"/><text x="460" y="563" text-anchor="middle" class="h">检索</text><text x="460" y="590" text-anchor="middle" class="b">查询索引</text>
    <path d="M555 569H615" class="ar"/>
    <rect x="630" y="530" width="190" height="78" rx="17" fill="#f0fdfa"/><text x="725" y="563" text-anchor="middle" class="h">Top-k 证据</text><text x="725" y="590" text-anchor="middle" class="b">相关候选</text>
    <path d="M820 569H880" class="ar"/>
    <rect x="895" y="530" width="190" height="78" rx="17" fill="#f0fdfa"/><text x="990" y="563" text-anchor="middle" class="h">增强提示</text><text x="990" y="590" text-anchor="middle" class="b">问题 + 证据</text>
    <path d="M1085 569H1145" class="ar"/>
    <rect x="1160" y="530" width="140" height="78" rx="17" fill="#ccfbf1"/><text x="1230" y="563" text-anchor="middle" class="h">回答</text><text x="1230" y="590" text-anchor="middle" class="b">含引用</text>
  </g>
  <text x="700" y="715" text-anchor="middle" class="p">离线阶段决定“能搜索什么”；在线阶段决定“这次找到什么”。</text>
</svg>
