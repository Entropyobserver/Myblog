<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="t d"><title id="t">Evidence quality limits answer quality</title><desc id="d">Complete, partial, wrong, and insufficient evidence lead to different outcomes.</desc><style>.t{font:700 38px Inter,Arial;fill:#0f172a}.h{font:700 22px Inter,Arial;fill:#0f172a}.b{font:400 16px Inter,Arial;fill:#475569}.g{font:700 17px Inter,Arial;fill:#15803d}.o{font:700 17px Inter,Arial;fill:#b45309}.r{font:700 17px Inter,Arial;fill:#b91c1c}</style><rect width="1400" height="620" rx="28" fill="#f8fafc"/><text x="70" y="72" class="t">Retrieved evidence sets the ceiling for the answer</text><text x="70" y="108" class="b">Same question, same language model—only the evidence changes.</text><g><rect x="70" y="160" width="285" height="350" rx="22" fill="white" stroke="#86efac" stroke-width="2"/><text x="212" y="215" text-anchor="middle" class="h">Complete evidence</text><rect x="105" y="255" width="215" height="105" rx="15" fill="#f0fdf4"/><text x="212" y="290" text-anchor="middle" class="b">2017 report, p. 33</text><text x="212" y="330" text-anchor="middle" class="h">36%</text><text x="212" y="420" text-anchor="middle" class="g">Grounded answer + citation</text><text x="212" y="460" text-anchor="middle" class="b">All required support found</text>
<rect x="385" y="160" width="285" height="350" rx="22" fill="white" stroke="#fcd34d" stroke-width="2"/><text x="527" y="215" text-anchor="middle" class="h">Partial evidence</text><rect x="420" y="255" width="215" height="105" rx="15" fill="#fffbeb"/><text x="527" y="290" text-anchor="middle" class="b">Explanation found</text><text x="527" y="325" text-anchor="middle" class="b">number missing</text><text x="527" y="420" text-anchor="middle" class="o">Incomplete answer</text><text x="527" y="460" text-anchor="middle" class="b">Relevant is not sufficient</text>
<rect x="700" y="160" width="285" height="350" rx="22" fill="white" stroke="#fca5a5" stroke-width="2"/><text x="842" y="215" text-anchor="middle" class="h">Wrong evidence</text><rect x="735" y="255" width="215" height="105" rx="15" fill="#fef2f2"/><text x="842" y="290" text-anchor="middle" class="b">Similar metric</text><text x="842" y="325" text-anchor="middle" class="b">from the wrong year</text><text x="842" y="420" text-anchor="middle" class="r">Plausible wrong answer</text><text x="842" y="460" text-anchor="middle" class="b">Fluent is not grounded</text>
<rect x="1015" y="160" width="315" height="350" rx="22" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="1172" y="215" text-anchor="middle" class="h">Insufficient evidence</text><rect x="1050" y="255" width="245" height="105" rx="15" fill="#f8fafc"/><text x="1172" y="290" text-anchor="middle" class="b">No answer support</text><text x="1172" y="325" text-anchor="middle" class="b">in the Top-k context</text><text x="1172" y="420" text-anchor="middle" class="h">Retry or abstain</text><text x="1172" y="460" text-anchor="middle" class="b">Do not invent missing facts</text></g><text x="700" y="570" text-anchor="middle" class="h">A stronger generator cannot reliably recover evidence it never received.</text></svg>
