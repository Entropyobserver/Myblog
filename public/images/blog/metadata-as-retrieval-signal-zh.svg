<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="t d"><title id="t">Metadata 也是检索信号</title><desc id="d">系统先用年份、文档和对象类型过滤语料，再对证据进行相关性排序。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b"/></marker><style>.t{font:700 36px Inter,"Microsoft YaHei",Arial;fill:#0f172a}.h{font:700 21px Inter,"Microsoft YaHei",Arial;fill:#0f172a}.b{font:400 16px Inter,"Microsoft YaHei",Arial;fill:#475569}.a{stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1400" height="600" rx="28" fill="#f8fafc"/><text x="70" y="70" class="t">Metadata 不只是标签，也可以缩小搜索空间</text><text x="70" y="108" class="b">Metadata 既记录引用来源，也能作为过滤条件。</text><rect x="70" y="180" width="300" height="260" rx="22" fill="white" stroke="#93c5fd" stroke-width="2"/><text x="220" y="225" text-anchor="middle" class="h">问题中的约束</text><rect x="115" y="260" width="210" height="40" rx="12" fill="#eff6ff"/><text x="220" y="286" text-anchor="middle" class="b">year = 2017</text><rect x="115" y="315" width="210" height="40" rx="12" fill="#eff6ff"/><text x="220" y="341" text-anchor="middle" class="b">文档 = 年报</text><rect x="115" y="370" width="210" height="40" rx="12" fill="#eff6ff"/><text x="220" y="396" text-anchor="middle" class="b">对象 = 表格</text><line x1="370" y1="310" x2="455" y2="310" class="a"/><rect x="470" y="150" width="430" height="320" rx="22" fill="white" stroke="#c4b5fd" stroke-width="2"/><text x="685" y="195" text-anchor="middle" class="h">跨年度语料</text><g fill="#f5f3ff"><rect x="520" y="230" width="150" height="55" rx="10"/><rect x="700" y="230" width="150" height="55" rx="10"/><rect x="520" y="305" width="150" height="55" rx="10"/><rect x="700" y="305" width="150" height="55" rx="10"/></g><text x="595" y="264" text-anchor="middle" class="b">2016 年表格</text><text x="775" y="264" text-anchor="middle" class="b">2017 年段落</text><rect x="520" y="380" width="330" height="55" rx="10" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/><text x="685" y="414" text-anchor="middle" class="h">2017 年表格 ✓</text><line x1="900" y1="310" x2="985" y2="310" class="a"/><rect x="1000" y="180" width="330" height="260" rx="22" fill="white" stroke="#86efac" stroke-width="2"/><text x="1165" y="225" text-anchor="middle" class="h">筛选并排序</text><text x="1165" y="252" text-anchor="middle" class="b">排序后的证据</text><rect x="1045" y="290" width="240" height="80" rx="14" fill="#f0fdf4"/><text x="1165" y="323" text-anchor="middle" class="b">report_2017 · page_33</text><text x="1165" y="351" text-anchor="middle" class="b">table_candidate_01</text><text x="1165" y="405" text-anchor="middle" class="h">既可检索，也可引用</text><text x="700" y="535" text-anchor="middle" class="h">先用 metadata 排除不可能的结果，再用相关性模型排序剩余候选。</text></svg>
