<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">关键词检索与向量检索</title>
  <desc id="desc">同一个查询可以沿倒排索引匹配精确词项，也可以通过向量表示匹配语义。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#64748b"/></marker></defs>
  <rect width="960" height="520" rx="28" fill="#f8fafc"/>
  <text x="480" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">两种信号，两份候选列表</text>
  <rect x="330" y="72" width="300" height="62" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="480" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e3a8a">查询</text><text x="480" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0f172a">2017 年安哥拉液体产量占比</text>
  <path d="M480 134V166M480 166H245V188M480 166H715V188" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="70" y="190" width="350" height="230" rx="22" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="245" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">关键词检索 / BM25</text>
  <text x="245" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">精确词项与语料统计</text>
  <rect x="105" y="280" width="280" height="52" rx="12" fill="#eff6ff"/><text x="245" y="312" text-anchor="middle" font-family="monospace" font-size="16" fill="#0f172a">词项 → 倒排列表</text>
  <text x="110" y="362" font-family="Arial,sans-serif" font-size="15" fill="#334155">优势：名称 · 数字 · 标识符</text>
  <text x="110" y="390" font-family="Arial,sans-serif" font-size="15" fill="#334155">弱点：同义表达 · 改写</text>
  <rect x="540" y="190" width="350" height="230" rx="22" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="715" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#7c3aed">向量检索</text>
  <text x="715" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">学习得到的语义表示</text>
  <rect x="575" y="280" width="280" height="52" rx="12" fill="#f5f3ff"/><text x="715" y="312" text-anchor="middle" font-family="monospace" font-size="16" fill="#0f172a">e(q) ↔ e(d)</text>
  <text x="580" y="362" font-family="Arial,sans-serif" font-size="15" fill="#334155">优势：语义 · 改写</text>
  <text x="580" y="390" font-family="Arial,sans-serif" font-size="15" fill="#334155">弱点：精确年份 · 细微差异</text>
  <rect x="250" y="450" width="460" height="44" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="478" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#92400e">两者返回的都只是候选，不能直接证明证据正确</text>
</svg>
