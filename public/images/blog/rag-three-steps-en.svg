<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="t d"><title id="t">The three steps of RAG</title><desc id="d">A question flows through retrieval, augmentation, and generation to produce a grounded answer.</desc><defs><linearGradient id="g"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b"/></marker><style>.t{font:700 38px Inter,Arial,sans-serif;fill:#0f172a}.h{font:700 24px Inter,Arial,sans-serif;fill:#0f172a}.b{font:400 17px Inter,Arial,sans-serif;fill:#475569}.n{font:700 18px Inter,Arial,sans-serif;fill:white}.a{stroke:#64748b;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1400" height="620" rx="28" fill="url(#g)"/><text x="70" y="72" class="t">RAG = Retrieval + Augmentation + Generation</text><text x="70" y="108" class="b">Find external evidence first, then ask the language model to answer from it.</text><g>
<rect x="70" y="180" width="220" height="270" rx="24" fill="white" stroke="#bfdbfe" stroke-width="2"/><text x="180" y="250" text-anchor="middle" class="h">Question</text><text x="180" y="300" text-anchor="middle" class="b">“What was the</text><text x="180" y="328" text-anchor="middle" class="b">share in 2017?”</text>
<line x1="290" y1="315" x2="350" y2="315" class="a"/><rect x="365" y="160" width="270" height="310" rx="24" fill="white" stroke="#c4b5fd" stroke-width="2"/><circle cx="415" cy="210" r="25" fill="#7c3aed"/><text x="415" y="217" text-anchor="middle" class="n">1</text><text x="455" y="218" class="h">Retrieval</text><text x="500" y="275" text-anchor="middle" class="b">Search reports, pages,</text><text x="500" y="303" text-anchor="middle" class="b">paragraphs, and tables</text><rect x="415" y="345" width="170" height="55" rx="14" fill="#f5f3ff"/><text x="500" y="379" text-anchor="middle" class="h">Evidence</text>
<line x1="635" y1="315" x2="695" y2="315" class="a"/><rect x="710" y="160" width="270" height="310" rx="24" fill="white" stroke="#67e8f9" stroke-width="2"/><circle cx="760" cy="210" r="25" fill="#0891b2"/><text x="760" y="217" text-anchor="middle" class="n">2</text><text x="800" y="218" class="h">Augmentation</text><text x="845" y="275" text-anchor="middle" class="b">Combine the question</text><text x="845" y="303" text-anchor="middle" class="b">with retrieved evidence</text><rect x="760" y="345" width="170" height="55" rx="14" fill="#ecfeff"/><text x="845" y="379" text-anchor="middle" class="h">Prompt</text>
<line x1="980" y1="315" x2="1040" y2="315" class="a"/><rect x="1055" y="160" width="275" height="310" rx="24" fill="white" stroke="#86efac" stroke-width="2"/><circle cx="1105" cy="210" r="25" fill="#16a34a"/><text x="1105" y="217" text-anchor="middle" class="n">3</text><text x="1145" y="218" class="h">Generation</text><text x="1192" y="275" text-anchor="middle" class="b">Compose an answer</text><text x="1192" y="303" text-anchor="middle" class="b">supported by context</text><rect x="1100" y="345" width="185" height="55" rx="14" fill="#ecfdf5"/><text x="1192" y="379" text-anchor="middle" class="h">36% [p. 33]</text></g><text x="700" y="550" text-anchor="middle" class="h">RAG adds external evidence at answer time; it does not retrain the model.</text></svg>
