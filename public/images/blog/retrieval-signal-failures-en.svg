<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Complementary retrieval failure modes</title><desc id="desc">Keyword and dense retrieval succeed on different query patterns and can both retrieve wrong evidence.</desc>
  <rect width="960" height="470" rx="28" fill="#f8fafc"/><text x="480" y="46" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Same corpus, different strengths</text>
  <text x="330" y="96" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1d4ed8">BM25</text><text x="690" y="96" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#7c3aed">Dense</text>
  <g font-family="Arial" font-size="15"><text x="60" y="151" fill="#334155">Exact ID: BLOCK-17A</text><text x="60" y="231" fill="#334155">Paraphrase: “net profit”</text><text x="60" y="311" fill="#334155">Near-copy, wrong year</text><text x="60" y="391" fill="#334155">Damaged OCR token</text></g>
  <g font-family="Arial" font-size="16" font-weight="700" text-anchor="middle"><rect x="245" y="120" width="170" height="48" rx="12" fill="#dcfce7"/><text x="330" y="150" fill="#166534">✓ exact match</text><rect x="605" y="120" width="170" height="48" rx="12" fill="#fee2e2"/><text x="690" y="150" fill="#991b1b">△ may blur</text><rect x="245" y="200" width="170" height="48" rx="12" fill="#fee2e2"/><text x="330" y="230" fill="#991b1b">✕ no overlap</text><rect x="605" y="200" width="170" height="48" rx="12" fill="#dcfce7"/><text x="690" y="230" fill="#166534">✓ semantic match</text><rect x="245" y="280" width="170" height="48" rx="12" fill="#fef3c7"/><text x="330" y="310" fill="#92400e">△ year can help</text><rect x="605" y="280" width="170" height="48" rx="12" fill="#fee2e2"/><text x="690" y="310" fill="#991b1b">✕ dangerously close</text><rect x="245" y="360" width="170" height="48" rx="12" fill="#fee2e2"/><text x="330" y="390" fill="#991b1b">✕ token missing</text><rect x="605" y="360" width="170" height="48" rx="12" fill="#fef3c7"/><text x="690" y="390" fill="#92400e">△ may recover</text></g>
  <path d="M220 104H805M220 184H805M220 264H805M220 344H805M220 424H805" stroke="#e2e8f0"/>
</svg>
