<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="t d"><title id="t">Offline and online phases of RAG</title><desc id="d">Documents are prepared and indexed offline, then searched online for each question.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b"/></marker><style>.t{font:700 38px Inter,Arial;fill:#0f172a}.h{font:700 22px Inter,Arial;fill:#0f172a}.b{font:400 16px Inter,Arial;fill:#475569}.a{stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1400" height="650" rx="28" fill="#f8fafc"/><text x="70" y="72" class="t">A complete RAG system has two phases</text><rect x="70" y="120" width="1260" height="205" rx="24" fill="white" stroke="#93c5fd" stroke-width="2"/><text x="110" y="165" class="h">OFFLINE — prepare the knowledge base</text><g><rect x="110" y="205" width="165" height="70" rx="15" fill="#eff6ff"/><text x="192" y="248" text-anchor="middle" class="h">Documents</text><line x1="275" y1="240" x2="345" y2="240" class="a"/><rect x="360" y="205" width="165" height="70" rx="15" fill="#eff6ff"/><text x="442" y="248" text-anchor="middle" class="h">Parse</text><line x1="525" y1="240" x2="595" y2="240" class="a"/><rect x="610" y="205" width="165" height="70" rx="15" fill="#eff6ff"/><text x="692" y="248" text-anchor="middle" class="h">Chunk</text><line x1="775" y1="240" x2="845" y2="240" class="a"/><rect x="860" y="205" width="165" height="70" rx="15" fill="#eff6ff"/><text x="942" y="248" text-anchor="middle" class="h">Represent</text><line x1="1025" y1="240" x2="1095" y2="240" class="a"/><rect x="1110" y="205" width="165" height="70" rx="15" fill="#dbeafe"/><text x="1192" y="248" text-anchor="middle" class="h">Index</text></g><rect x="70" y="360" width="1260" height="205" rx="24" fill="white" stroke="#5eead4" stroke-width="2"/><text x="110" y="405" class="h">ONLINE — answer each question</text><g><rect x="110" y="445" width="165" height="70" rx="15" fill="#f0fdfa"/><text x="192" y="488" text-anchor="middle" class="h">Query</text><line x1="275" y1="480" x2="345" y2="480" class="a"/><rect x="360" y="445" width="165" height="70" rx="15" fill="#f0fdfa"/><text x="442" y="488" text-anchor="middle" class="h">Retrieve</text><line x1="525" y1="480" x2="595" y2="480" class="a"/><rect x="610" y="445" width="165" height="70" rx="15" fill="#f0fdfa"/><text x="692" y="488" text-anchor="middle" class="h">Top-k</text><line x1="775" y1="480" x2="845" y2="480" class="a"/><rect x="860" y="445" width="165" height="70" rx="15" fill="#f0fdfa"/><text x="942" y="488" text-anchor="middle" class="h">Augment</text><line x1="1025" y1="480" x2="1095" y2="480" class="a"/><rect x="1110" y="445" width="165" height="70" rx="15" fill="#ccfbf1"/><text x="1192" y="488" text-anchor="middle" class="h">Answer</text></g><text x="700" y="615" text-anchor="middle" class="b">Offline determines what can be searched; online determines what was found for this question.</text></svg>
