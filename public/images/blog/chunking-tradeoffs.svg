<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="t d"><title id="t">Chunking trade-offs</title><desc id="d">Small, large, and structure-aware chunks trade precision, context, and document integrity differently.</desc><style>.t{font:700 36px Inter,"Microsoft YaHei",Arial;fill:#0f172a}.h{font:700 22px Inter,"Microsoft YaHei",Arial;fill:#0f172a}.b{font:400 16px Inter,"Microsoft YaHei",Arial;fill:#475569}.g{font:700 16px Inter,"Microsoft YaHei",Arial;fill:#15803d}.r{font:700 16px Inter,"Microsoft YaHei",Arial;fill:#b45309}</style><rect width="1400" height="700" rx="28" fill="#f8fafc"/><text x="70" y="70" class="t">Chunking 是证据边界设计 / Chunking designs evidence boundaries</text><text x="70" y="108" class="b">There is no universally best chunk size: the right unit depends on the document and the question.</text><g>
<rect x="70" y="165" width="390" height="430" rx="24" fill="white" stroke="#93c5fd" stroke-width="2"/><text x="265" y="215" text-anchor="middle" class="h">小块 / Small chunks</text><g fill="#eff6ff"><rect x="115" y="255" width="300" height="35" rx="8"/><rect x="115" y="305" width="300" height="35" rx="8"/><rect x="115" y="355" width="300" height="35" rx="8"/><rect x="115" y="405" width="300" height="35" rx="8"/></g><text x="265" y="485" text-anchor="middle" class="g">✓ 精确、噪声少 / precise</text><text x="265" y="522" text-anchor="middle" class="r">△ 容易切断上下文和表格</text><text x="265" y="552" text-anchor="middle" class="b">may break context and tables</text>
<rect x="505" y="165" width="390" height="430" rx="24" fill="white" stroke="#fcd34d" stroke-width="2"/><text x="700" y="215" text-anchor="middle" class="h">大块 / Large chunks</text><rect x="550" y="255" width="300" height="185" rx="12" fill="#fffbeb"/><path d="M580 290h240M580 325h240M580 360h240M580 395h180" stroke="#f59e0b" stroke-width="5"/><text x="700" y="485" text-anchor="middle" class="g">✓ 保留较多上下文 / more context</text><text x="700" y="522" text-anchor="middle" class="r">△ 噪声多、成本高 / noisy, costly</text>
<rect x="940" y="165" width="390" height="430" rx="24" fill="white" stroke="#86efac" stroke-width="2"/><text x="1135" y="215" text-anchor="middle" class="h">结构感知 / Structure-aware</text><rect x="985" y="250" width="300" height="45" rx="9" fill="#dcfce7"/><text x="1135" y="279" text-anchor="middle" class="b">Section heading</text><rect x="985" y="310" width="300" height="75" rx="9" fill="#f0fdf4"/><text x="1135" y="354" text-anchor="middle" class="b">Paragraph + heading context</text><rect x="985" y="400" width="300" height="55" rx="9" fill="#d1fae5"/><text x="1135" y="434" text-anchor="middle" class="b">Table + repeated header</text><text x="1135" y="500" text-anchor="middle" class="g">✓ 保留语义与文档结构</text><text x="1135" y="535" text-anchor="middle" class="b">preserves semantic boundaries</text></g><text x="700" y="650" text-anchor="middle" class="h">Chunk 是检索单元；evidence object 是可追溯的原始证据。二者可以重叠，但不必相同。</text></svg>
