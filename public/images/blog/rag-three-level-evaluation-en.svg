<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="t d"><title id="t">Three levels of RAG evaluation</title><desc id="d">RAG evaluation separates retrieval ranking, evidence correctness and completeness, and generated answer quality.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b"/></marker><style>.t{font:700 36px Inter,"Microsoft YaHei",Arial;fill:#0f172a}.h{font:700 23px Inter,"Microsoft YaHei",Arial;fill:#0f172a}.b{font:400 16px Inter,"Microsoft YaHei",Arial;fill:#475569}.a{stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1400" height="610" rx="28" fill="#f8fafc"/><text x="70" y="70" class="t">Do not evaluate only the final answer</text><text x="70" y="106" class="b">A correct answer can hide wrong evidence; a wrong answer can start with successful retrieval.</text><g><rect x="70" y="170" width="360" height="315" rx="24" fill="white" stroke="#c4b5fd" stroke-width="2"/><text x="250" y="220" text-anchor="middle" class="h">1 · Retrieval quality</text><text x="250" y="250" text-anchor="middle" class="b">Candidate and ranking quality</text><rect x="115" y="290" width="270" height="48" rx="12" fill="#f5f3ff"/><text x="250" y="320" text-anchor="middle" class="b">Recall@k · Precision@k</text><rect x="115" y="355" width="270" height="48" rx="12" fill="#f5f3ff"/><text x="250" y="385" text-anchor="middle" class="b">MRR · nDCG</text><text x="250" y="445" text-anchor="middle" class="b">Did the correct object enter Top-k?</text><line x1="430" y1="327" x2="505" y2="327" class="a"/>
<rect x="520" y="170" width="360" height="315" rx="24" fill="white" stroke="#86efac" stroke-width="2"/><text x="700" y="220" text-anchor="middle" class="h">2 · Evidence quality</text><text x="700" y="250" text-anchor="middle" class="b">Evidence correctness and completeness</text><rect x="565" y="290" width="270" height="48" rx="12" fill="#f0fdf4"/><text x="700" y="320" text-anchor="middle" class="b">correct report · page · object</text><rect x="565" y="355" width="270" height="48" rx="12" fill="#f0fdf4"/><text x="700" y="385" text-anchor="middle" class="b">any evidence vs all evidence</text><text x="700" y="445" text-anchor="middle" class="b">Was all required evidence found?</text><line x1="880" y1="327" x2="955" y2="327" class="a"/>
<rect x="970" y="170" width="360" height="315" rx="24" fill="white" stroke="#67e8f9" stroke-width="2"/><text x="1150" y="220" text-anchor="middle" class="h">3 · Answer quality</text><text x="1150" y="250" text-anchor="middle" class="b">Final answer quality</text><rect x="1015" y="290" width="270" height="48" rx="12" fill="#ecfeff"/><text x="1150" y="320" text-anchor="middle" class="b">correctness · relevance</text><rect x="1015" y="355" width="270" height="48" rx="12" fill="#ecfeff"/><text x="1150" y="385" text-anchor="middle" class="b">faithfulness · citation</text><text x="1150" y="445" text-anchor="middle" class="b">Is the conclusion supported by evidence?</text></g><text x="700" y="555" text-anchor="middle" class="h">Answer correctness ≠ retrieval correctness ≠ evidence completeness</text></svg>
