<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Multi-hop evidence chain</title><desc id="desc">An original question is decomposed into dependent searches that recover blocks, numerator, and denominator before computing an answer.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#64748b"/></marker></defs><rect width="960" height="500" rx="28" fill="#f8fafc"/><text x="480" y="44" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Multi-hop retrieval follows evidence dependencies</text><rect x="270" y="75" width="420" height="58" rx="16" fill="#dbeafe" stroke="#60a5fa"/><text x="480" y="110" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1e3a8a">Original question: what share?</text>
  <g font-family="Arial"><rect x="50" y="205" width="240" height="110" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><text x="170" y="242" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">Hop 1 · entities</text><text x="170" y="277" text-anchor="middle" font-size="15" fill="#334155">Which three blocks?</text><rect x="360" y="205" width="240" height="110" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><text x="480" y="242" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">Hop 2 · numerator</text><text x="480" y="277" text-anchor="middle" font-size="15" fill="#334155">Combined production?</text><rect x="670" y="205" width="240" height="110" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><text x="790" y="242" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">Hop 3 · denominator</text><text x="790" y="277" text-anchor="middle" font-size="15" fill="#334155">Outside-Norway total?</text></g><path d="M480 133V170H170V198M480 170V198M480 170H790V198M290 260H352M600 260H662" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M170 315V358H480M480 315V385M790 315V358H480" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="330" y="385" width="300" height="70" rx="18" fill="#d1fae5" stroke="#34d399" stroke-width="2"/><text x="480" y="415" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#065f46">Answer + evidence path</text><text x="480" y="440" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">all required hops present</text></svg>
