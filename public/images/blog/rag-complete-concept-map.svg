<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="t d"><title id="t">Complete RAG concept map</title><desc id="d">The complete path from sources through parsing, chunks, representation, retrieval, reranking, evidence, generation, and verification.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b"/></marker><style>.t{font:700 36px Inter,"Microsoft YaHei",Arial;fill:#0f172a}.h{font:700 18px Inter,"Microsoft YaHei",Arial;fill:#0f172a}.b{font:400 14px Inter,"Microsoft YaHei",Arial;fill:#475569}.a{stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="720" rx="28" fill="#f8fafc"/><text x="70" y="70" class="t">RAG 是一条可检查的数据链 / RAG is an inspectable data chain</text><text x="70" y="106" class="b">Every stage changes what evidence the model can finally use.</text><text x="75" y="165" class="h">OFFLINE · 知识准备</text><g>
<rect x="70" y="195" width="170" height="105" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="155" y="235" text-anchor="middle" class="h">Sources</text><text x="155" y="263" text-anchor="middle" class="b">PDF · Web · DB</text><line x1="240" y1="247" x2="285" y2="247" class="a"/>
<rect x="300" y="195" width="170" height="105" rx="18" fill="#ecfeff" stroke="#67e8f9"/><text x="385" y="235" text-anchor="middle" class="h">Parse</text><text x="385" y="263" text-anchor="middle" class="b">text · table · layout</text><line x1="470" y1="247" x2="515" y2="247" class="a"/>
<rect x="530" y="195" width="170" height="105" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/><text x="615" y="235" text-anchor="middle" class="h">Objects</text><text x="615" y="263" text-anchor="middle" class="b">content + provenance</text><line x1="700" y1="247" x2="745" y2="247" class="a"/>
<rect x="760" y="195" width="170" height="105" rx="18" fill="#fffbeb" stroke="#fcd34d"/><text x="845" y="235" text-anchor="middle" class="h">Chunk</text><text x="845" y="263" text-anchor="middle" class="b">retrieval units</text><line x1="930" y1="247" x2="975" y2="247" class="a"/>
<rect x="990" y="195" width="190" height="105" rx="18" fill="#f0fdf4" stroke="#86efac"/><text x="1085" y="235" text-anchor="middle" class="h">Represent</text><text x="1085" y="263" text-anchor="middle" class="b">terms · embeddings</text><line x1="1180" y1="247" x2="1225" y2="247" class="a"/>
<rect x="1240" y="195" width="190" height="105" rx="18" fill="#dcfce7" stroke="#4ade80"/><text x="1335" y="235" text-anchor="middle" class="h">Index</text><text x="1335" y="263" text-anchor="middle" class="b">fast searchable store</text></g>
<path d="M1335 300V365H155" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/><text x="75" y="410" class="h">ONLINE · 问答</text><g>
<rect x="70" y="440" width="170" height="105" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="155" y="480" text-anchor="middle" class="h">Query</text><text x="155" y="508" text-anchor="middle" class="b">intent + constraints</text><line x1="240" y1="492" x2="285" y2="492" class="a"/>
<rect x="300" y="440" width="190" height="105" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/><text x="395" y="480" text-anchor="middle" class="h">Retrieve</text><text x="395" y="508" text-anchor="middle" class="b">BM25 · dense · graph</text><line x1="490" y1="492" x2="535" y2="492" class="a"/>
<rect x="550" y="440" width="180" height="105" rx="18" fill="#faf5ff" stroke="#d8b4fe"/><text x="640" y="480" text-anchor="middle" class="h">Fuse / Rerank</text><text x="640" y="508" text-anchor="middle" class="b">refine candidates</text><line x1="730" y1="492" x2="775" y2="492" class="a"/>
<rect x="790" y="440" width="180" height="105" rx="18" fill="#ecfdf5" stroke="#6ee7b7"/><text x="880" y="480" text-anchor="middle" class="h">Evidence</text><text x="880" y="508" text-anchor="middle" class="b">correct + complete?</text><line x1="970" y1="492" x2="1015" y2="492" class="a"/>
<rect x="1030" y="440" width="180" height="105" rx="18" fill="#ecfeff" stroke="#67e8f9"/><text x="1120" y="480" text-anchor="middle" class="h">Augment</text><text x="1120" y="508" text-anchor="middle" class="b">query + evidence</text><line x1="1210" y1="492" x2="1255" y2="492" class="a"/>
<rect x="1270" y="440" width="160" height="105" rx="18" fill="#dcfce7" stroke="#4ade80"/><text x="1350" y="480" text-anchor="middle" class="h">Generate</text><text x="1350" y="508" text-anchor="middle" class="b">answer + citation</text></g><rect x="550" y="600" width="880" height="65" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="990" y="628" text-anchor="middle" class="h">Verify → retry, correct, or abstain / 验证 → 重试、修正或拒答</text><text x="990" y="652" text-anchor="middle" class="b">Reliability is an end-to-end property, not one model score.</text></svg>
