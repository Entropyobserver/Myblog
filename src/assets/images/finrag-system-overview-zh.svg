<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FinRAG 系统概览</title>
  <desc id="desc">从跨年度年报和用户问题开始，经过结构化 PDF 处理、混合检索、图扩展、重排序和证据完整性检查，生成带引用答案，或触发恢复和拒答。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, "Microsoft YaHei", sans-serif; fill: #475569; }
      .stage { font: 700 24px Inter, "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 650 21px Inter, "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 17px Inter, "Microsoft YaHei", sans-serif; fill: #475569; }
      .small { font: 500 15px Inter, "Microsoft YaHei", sans-serif; fill: #64748b; }
      .metric { font: 700 19px Inter, "Microsoft YaHei", sans-serif; fill: white; }
      .pill { font: 650 16px Inter, "Microsoft YaHei", sans-serif; fill: #164e63; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>

  <text x="80" y="78" class="title">FinRAG：从长篇年报到可追溯答案</text>
  <text x="80" y="116" class="subtitle">核心不是“让模型读 PDF”，而是先定位正确、完整、可验证的证据。</text>

  <rect x="80" y="145" width="1440" height="64" rx="18" fill="url(#hero)"/>
  <text x="800" y="186" text-anchor="middle" class="metric">15 份年报　·　4,369 页　·　41,736 个证据单元　·　720 个 QA</text>

  <!-- stage headings -->
  <text x="235" y="268" text-anchor="middle" class="stage">1　输入与结构化</text>
  <text x="800" y="268" text-anchor="middle" class="stage">2　证据检索</text>
  <text x="1365" y="268" text-anchor="middle" class="stage">3　验证与回答</text>

  <!-- input cards -->
  <g filter="url(#shadow)">
    <rect x="80" y="300" width="310" height="140" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="130" cy="350" r="26" fill="#dbeafe"/>
    <path d="M116 340h28M116 350h28M116 360h20" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <text x="170" y="344" class="label">跨年度年报 PDF</text>
    <text x="170" y="375" class="body">2010–2024</text>
    <text x="170" y="402" class="small">重复指标、表格、长文档</text>

    <rect x="80" y="470" width="310" height="120" rx="22" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <circle cx="130" cy="530" r="26" fill="#ccfbf1"/>
    <path d="M120 522a12 12 0 1 1 19 10l-1 10h-12l-1-10a12 12 0 0 1-5-10zM127 549h10" stroke="#0f766e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <text x="170" y="520" class="label">用户问题</text>
    <text x="170" y="551" class="body">实体 · 年份 · 指标 · 多跳需求</text>
  </g>

  <path d="M390 370 H445" class="arrow"/>
  <path d="M390 530 H420 Q445 530 445 505 V430" class="arrow"/>

  <!-- structured evidence -->
  <g filter="url(#shadow)">
    <rect x="460" y="300" width="260" height="290" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="590" y="343" text-anchor="middle" class="label">PDF 结构化处理</text>
    <rect x="500" y="370" width="180" height="42" rx="13" fill="#eff6ff"/>
    <text x="590" y="397" text-anchor="middle" class="pill">Layout extraction</text>
    <rect x="500" y="426" width="180" height="42" rx="13" fill="#eff6ff"/>
    <text x="590" y="453" text-anchor="middle" class="pill">段落与表格对象</text>
    <rect x="500" y="482" width="180" height="42" rx="13" fill="#eff6ff"/>
    <text x="590" y="509" text-anchor="middle" class="pill">质量审计</text>
    <text x="590" y="552" text-anchor="middle" class="small">report · page · object ID</text>
  </g>

  <path d="M720 445 H760" class="arrow"/>

  <!-- retrieval -->
  <g filter="url(#shadow)">
    <rect x="775" y="300" width="360" height="290" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="955" y="343" text-anchor="middle" class="label">分层候选检索</text>
    <rect x="815" y="370" width="280" height="42" rx="13" fill="#f5f3ff"/>
    <text x="955" y="397" text-anchor="middle" class="pill">报告 / 年份过滤</text>
    <rect x="815" y="426" width="132" height="42" rx="13" fill="#f5f3ff"/>
    <text x="881" y="453" text-anchor="middle" class="pill">BM25</text>
    <rect x="963" y="426" width="132" height="42" rx="13" fill="#f5f3ff"/>
    <text x="1029" y="453" text-anchor="middle" class="pill">Dense</text>
    <rect x="815" y="482" width="132" height="42" rx="13" fill="#f5f3ff"/>
    <text x="881" y="509" text-anchor="middle" class="pill">RRF 融合</text>
    <rect x="963" y="482" width="132" height="42" rx="13" fill="#f5f3ff"/>
    <text x="1029" y="509" text-anchor="middle" class="pill">Graph 扩展</text>
    <text x="955" y="552" text-anchor="middle" class="small">Cross-encoder reranking → Top-k</text>
  </g>

  <path d="M1135 445 H1185" class="arrow"/>

  <!-- verify and answer -->
  <g filter="url(#shadow)">
    <rect x="1200" y="300" width="320" height="150" rx="22" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <circle cx="1250" cy="350" r="25" fill="#dcfce7"/>
    <path d="M1239 350l8 8 16-19" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1290" y="344" class="label">证据完整性检查</text>
    <text x="1290" y="377" class="body">年份正确？证据找全？</text>
    <text x="1290" y="406" class="small">支持多跳与可回答性判断</text>

    <rect x="1200" y="480" width="320" height="110" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="1360" y="522" text-anchor="middle" class="label">有依据的答案</text>
    <text x="1360" y="555" text-anchor="middle" class="body">答案 + 报告 + 页码 + 引用</text>
  </g>

  <path d="M1360 450 V480" class="arrow"/>

  <!-- recovery lane -->
  <rect x="460" y="675" width="1060" height="135" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="500" y="718" class="label">证据不足时：Failure-aware recovery</text>
  <rect x="500" y="740" width="195" height="42" rx="13" fill="#ffedd5"/>
  <text x="597" y="767" text-anchor="middle" class="pill">识别失败信号</text>
  <path d="M700 761 H748" class="arrow"/>
  <rect x="755" y="740" width="225" height="42" rx="13" fill="#ffedd5"/>
  <text x="867" y="767" text-anchor="middle" class="pill">切换 / 扩大检索</text>
  <path d="M985 761 H1033" class="arrow"/>
  <rect x="1040" y="740" width="180" height="42" rx="13" fill="#ffedd5"/>
  <text x="1130" y="767" text-anchor="middle" class="pill">重新验证</text>
  <path d="M1225 761 H1273" class="arrow"/>
  <rect x="1280" y="740" width="200" height="42" rx="13" fill="#fee2e2"/>
  <text x="1380" y="767" text-anchor="middle" class="pill">仍不足 → 拒答</text>

  <path d="M1260 430 C1160 625 1110 650 960 675" class="arrow dash"/>
  <text x="1120" y="630" class="small">不完整 / 冲突</text>
  <path d="M755 740 C720 670 775 625 850 590" class="arrow dash"/>

  <text x="80" y="858" class="small">评价重点：不是“检索到相关文本”，而是“是否找到了回答所需的全部证据”。</text>
</svg>
